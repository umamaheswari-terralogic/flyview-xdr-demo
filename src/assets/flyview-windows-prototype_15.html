// Full compliance check lists exactly as defined in MDM PRD §7.1, split by platform.
// "Antivirus Up-to-date" and "Secure Boot Enabled" are NOT in the PRD - flagged separately, not mixed into the real list.
const WINDOWS_CHECKS = [
  "OS version minimum", "Passcode/PIN required", "BitLocker Encryption", "Screen Lock Configured",
  "Required apps installed", "Blocked apps not installed", "Last check-in", "Windows Firewall",
  "Antivirus Active", "Developer Mode Disabled",
];
const MACOS_CHECKS = [
  "OS version minimum", "Passcode/PIN required", "FileVault Encryption", "Screen Lock Configured",
  "Jailbroken / rooted", "Required apps installed", "Blocked apps not installed", "Last check-in",
  "Firewall enabled", "SIP enabled", "Gatekeeper enabled", "Developer Mode Disabled",
];
const NOT_IN_PRD_CHECKS = ["Antivirus Up-to-date", "Secure Boot Enabled"];

function getComplianceChecks(device) {
  const isWindows = device.os.startsWith("Windows");
  const platformList = isWindows ? WINDOWS_CHECKS : MACOS_CHECKS;
  const existing = {};
  device.checks.forEach((c) => { existing[c.name] = c.pass; });
  // map existing seed check names to the canonical PRD names above
  const aliasMap = {
    "BitLocker encryption": "BitLocker Encryption",
    "FileVault encryption": "FileVault Encryption",
    "OS version minimum": "OS version minimum",
    "Antivirus active": "Antivirus Active",
    "Developer mode disabled": "Developer Mode Disabled",
  };
  const resolved = {};
  Object.entries(existing).forEach(([k, v]) => { resolved[aliasMap[k] || k] = v; });
  return platformList.map((name) => ({ name, pass: resolved[name] !== undefined ? resolved[name] : true }));
}

function getLocalDatabases(device) {
  // Local database software found running on the endpoint (repository inventory - local, not cloud/SaaS)
  const pool = [
    { name: "PostgreSQL", version: "15.2", port: 5432, status: "Running" },
    { name: "MySQL", version: "8.0.36", port: 3306, status: "Stopped" },
    { name: "SQLite (local app data)", version: "3.45.1", port: null, status: "File-based" },
    { name: "Microsoft SQL Server Express", version: "15.0", port: 1433, status: "Running" },
  ];
  // vary which ones show up per device deterministically based on id
  const seed = device.id.charCodeAt(1) || 1;
  return pool.filter((_, i) => (seed + i) % 3 !== 0);
}

function getExtensions(device) {
  const base = [
    { name: "Google Docs Offline", id: "ghbmnnjooekpmoecnnnilnnbdlolhkhi", version: "1.106.1" },
    { name: "Edge relevant text changes", id: "jmjflgjpcpepeafmmgdpfkogkghcpiha", version: "1.2.1" },
  ];
  if (device.status === "NON-COMPLIANT") {
    base.unshift({ name: "Unknown extension", id: "nmmhkkegccagdldgiimedpiccmgmieda", version: "1.0.0.6" });
  }
  return base;
}

function getActivity(device) {
  const entries = [];
  for (let i = 0; i < 5; i++) {
    entries.push({ type: "checkin", message: `Device checked in — compliance: ${device.status.toLowerCase().replace(" ", "_")}`, time: `Jul ${21 - i}, 2026, ${8 - i}:${(25 - i * 3).toString().padStart(2, "0")} PM` });
  }
  entries.push({ type: "command", message: "Command collect_inventory → completed", time: "Jul 18, 2026, 7:35:03 PM" });
  entries.push({ type: "command", message: "Command collect_inventory → completed", time: "Jul 15, 2026, 7:35:03 PM" });
  return entries;
}

function statusStyle(status) {
  if (status === "COMPLIANT" || status === "ACTIVE" || status === "ENROLLED") return { dot: "bg-emerald-500", text: "text-emerald-700", bg: "bg-emerald-50" };
  if (status === "GRACE PERIOD" || status === "PARTIAL" || status === "PENDING POLICY") return { dot: "bg-amber-500", text: "text-amber-700", bg: "bg-amber-50" };
  if (status === "OPTIONAL") return { dot: "bg-emerald-400", text: "text-emerald-600", bg: "bg-emerald-50" };
  if (status === "AWAITING DEVICE") return { dot: "bg-gray-400", text: "text-gray-600", bg: "bg-gray-100" };
  return { dot: "bg-rose-500", text: "text-rose-700", bg: "bg-rose-50" };
}

function EnrollmentTab({ devices }) {
  const winCount = devices.filter((d) => d.os.startsWith("Windows")).length;
  const macManualCount = devices.filter((d) => d.os.startsWith("macOS") && d.enrollment === "Manual").length;
  const macDepCount = devices.filter((d) => d.os.startsWith("macOS") && d.enrollment === "DEP").length;
  const [winGenerated, setWinGenerated] = useState(null);
  const [macGenerated, setMacGenerated] = useState(null);

  function generateWinToken() {
    const token = Math.random().toString(36).slice(2, 10);
    setWinGenerated(`https://enroll.flyview.io/terralogic/msi/${token}`);
  }
  function generateMacLink() {
    const token = Math.random().toString(36).slice(2, 10);
    setMacGenerated(`https://enroll.flyview.io/terralogic/mac/${token}`);
  }

  return (
    <div className="p-8">
      <div className="bg-gray-50 border border-gray-100 rounded-xl p-4 mb-6 text-sm text-gray-600">
        Two enrollment methods are supported: <strong>Windows MSI installer</strong> and <strong>macOS Manual (non-DEP)</strong>. The {macDepCount} DEP-enrolled Macs shown elsewhere were enrolled separately and aren't managed from this page.
      </div>

      <div className="grid grid-cols-2 gap-4">
        {/* Windows MSI */}
        <div className="bg-white border border-gray-100 rounded-xl p-5">
          <div className="flex items-center gap-2 mb-1"><span className="text-lg">🪟</span><span className="font-medium text-gray-800">Windows — MSI Installer</span></div>
          <p className="text-xs text-gray-500 mb-4">Per MDM PRD §6.5. No zero-touch path exists for Windows — a signed installer is deployed to each device.</p>
          <div className="flex items-center justify-between text-sm mb-3">
            <span className="text-gray-600">Devices enrolled this way</span>
            <span className="text-gray-800 font-semibold">{winCount}</span>
          </div>
          <button onClick={generateWinToken} className="w-full py-2 rounded bg-orange-500 text-white text-sm font-medium hover:bg-orange-600">Generate MSI installer</button>
          {winGenerated && (
            <div className="mt-3 bg-gray-50 border border-gray-200 rounded-lg p-3">
              <div className="text-xs text-gray-400 mb-1">Signed installer ready — deploy via GPO, SCCM, Intune, or share this link:</div>
              <div className="font-mono text-xs text-gray-700 break-all bg-white border border-gray-200 rounded px-2 py-1.5">{winGenerated}</div>
              <div className="flex items-center gap-2 mt-2">
                <button className="text-xs px-2.5 py-1 rounded border border-gray-200 text-gray-600 hover:bg-gray-100">Copy link</button>
              </div>
            </div>
          )}
        </div>

        {/* macOS Manual */}
        <div className="bg-white border border-gray-100 rounded-xl p-5">
          <div className="flex items-center gap-2 mb-1"><span className="text-lg">🍎</span><span className="font-medium text-gray-800">macOS — Manual (non-DEP)</span></div>
          <p className="text-xs text-gray-500 mb-4">Per MDM PRD §6.6. For Macs not purchased through Apple Business Manager — enrolled directly, without ABM.</p>
          <div className="flex items-center justify-between text-sm mb-3">
            <span className="text-gray-600">Devices enrolled this way</span>
            <span className="text-gray-800 font-semibold">{macManualCount}</span>
          </div>
          <div className="bg-amber-50 border border-amber-100 rounded p-2 mb-3 text-xs text-amber-700">
            Unsupervised Macs can't have passcode cleared, restart, shutdown, or location remotely — per PRD §10.
          </div>
          <button onClick={generateMacLink} className="w-full py-2 rounded bg-orange-500 text-white text-sm font-medium hover:bg-orange-600">Generate enrollment link / QR</button>
          {macGenerated && (
            <div className="mt-3 bg-gray-50 border border-gray-200 rounded-lg p-3">
              <div className="text-xs text-gray-400 mb-1">Open this on the Mac, or scan the QR — installs the .mobileconfig directly, no ABM:</div>
              <div className="font-mono text-xs text-gray-700 break-all bg-white border border-gray-200 rounded px-2 py-1.5">{macGenerated}</div>
              <div className="flex items-center gap-3 mt-2">
                <div className="w-16 h-16 bg-white border border-gray-200 rounded flex items-center justify-center">{Ico("qrcode", { size: 32, className: "text-gray-400" })}</div>
                <button className="text-xs px-2.5 py-1 rounded border border-gray-200 text-gray-600 hover:bg-gray-100">Copy link</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function RemoteActionsTab({ devices, running, handleAction, log }) {
  const [selectedDeviceId, setSelectedDeviceId] = useState(devices[0].id);
  const selectedDevice = devices.find((d) => d.id === selectedDeviceId);

  return (
    <div className="p-8">
      <div className="bg-white border border-gray-100 rounded-xl p-5 mb-6">
        <div className="font-medium text-gray-800 mb-1">Remote actions — Windows (Phase 1)</div>

        <div className="grid grid-cols-4 gap-3">
          {remoteActions.map((a) => (
            <div key={a.key} className="border border-gray-100 rounded-lg p-3 bg-gray-50">
              <div className="flex items-center gap-2 mb-1">{Ico(a.icon, { size: 14, className: "text-gray-500" })}<span className="text-sm font-medium text-gray-800">{a.label}</span></div>
              <p className="text-xs text-gray-500">{actionDescriptions[a.key]}</p>
            </div>
          ))}
        </div>
      </div>

      <div className="bg-white border border-gray-100 rounded-xl p-5 mb-6">
        <div className="font-medium text-gray-800 mb-4">Run an action on a device</div>
        <div className="flex items-end gap-3 flex-wrap">
          <div className="flex-1 min-w-[220px]">
            <label className="text-xs text-gray-400 block mb-1">Device name</label>
            <select
              value={selectedDeviceId}
              onChange={(e) => setSelectedDeviceId(e.target.value)}
              className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 bg-white"
            >
              {devices.map((d) => <option key={d.id} value={d.id}>{d.name} — {d.user}</option>)}
            </select>
          </div>
          {selectedDevice && (
            <span className={`text-xs font-mono px-2 py-1 rounded mb-0.5 ${statusStyle(selectedDevice.status).bg} ${statusStyle(selectedDevice.status).text} flex items-center gap-1.5`}>
              <span className={`w-1.5 h-1.5 rounded-full ${statusStyle(selectedDevice.status).dot}`}></span> {selectedDevice.status}
            </span>
          )}
        </div>
        <div className="grid grid-cols-4 gap-2 mt-4">
          {remoteActions.map((a) => {
            const isRunning = running && running.id === selectedDeviceId && running.key === a.key;
            return (
              <button
                key={a.key}
                onClick={() => handleAction(selectedDeviceId, a.key)}
                disabled={!!running}
                className="flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg border border-gray-200 text-sm text-gray-700 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed"
              >
                {Ico(a.icon, { size: 15, className: "text-gray-500" })} {a.label}
                {isRunning && Ico("loader", { size: 13, className: "animate-spin text-amber-500" })}
              </button>
            );
          })}
        </div>
        {running && (
          <div className="mt-4 px-4 py-3 rounded-lg bg-amber-50 text-sm text-amber-700 flex items-center gap-2">
            {Ico("loader", { size: 14, className: "animate-spin" })}
            {devices.find((d) => d.id === running.id)?.name} — {remoteActions.find((a) => a.key === running.key)?.label} — {running.stage}
          </div>
        )}
      </div>

      <div className="bg-white border border-gray-100 rounded-xl overflow-hidden">
        <div className="px-5 py-4 border-b border-gray-100 font-medium text-gray-800">Recent activity</div>
        {log.length === 0 ? (
          <div className="p-5 text-sm text-gray-400 italic">No actions run yet.</div>
        ) : (
          <table className="w-full">
            <thead>
              <tr className="text-left text-[10px] tracking-wider text-gray-400 border-b border-gray-100">
                <th className="py-2.5 px-4 font-medium">DEVICE</th>
                <th className="py-2.5 px-4 font-medium">ACTION</th>
                <th className="py-2.5 px-4 font-medium">RESULT</th>
                <th className="py-2.5 px-4 font-medium">TIME</th>

            <tbody>
              {log.map((entry, i) => (
                <tr key={i} className="border-b border-gray-50">
                  <td className="py-3 px-4 text-sm font-medium text-gray-800">{entry.deviceName}</td>

                  <td className="py-3 px-4"><span className="text-xs font-mono px-2 py-1 rounded bg-emerald-50 text-emerald-700 flex items-center gap-1.5 w-fit">{Ico("check", { size: 11 })} Executed</span></td>

                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

              {tab === "All Devices" && <AllDevicesTab devices={devices} onView={setViewingId} />}
              {tab === "Enrollment" && <EnrollmentTab devices={devices} />}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
